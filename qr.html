<!doctype html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>أكواد QR - رحلة الحروف</title><link rel="stylesheet" href="style.css">
<style>.qrpage{max-width:1000px;margin:auto;padding:20px}.controls{display:grid;gap:10px}input{padding:14px;border:2px solid #eee;border-radius:14px;font:inherit}.qrgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-top:16px}.qrcard{text-align:center;border:1px solid #ddd;padding:12px;border-radius:16px}.qrcard img{width:160px;max-width:100%}@media(max-width:700px){.qrgrid{grid-template-columns:repeat(2,1fr)}}</style>
</head><body><div class="qrpage"><div class="hero"><div class="badge">🧩 إعداد المعلم</div><h1>أكواد QR لرحلة الحروف</h1><p>أدخل رابط موقعك ثم أنشئ 28 رمزًا.</p></div>
<section class="card controls"><label>رابط الموقع الأساسي<input id="base" value="https://bilalslimani166-dotcom.github.io/rahlet-alhorouf/"></label><button class="primary" onclick="makeQR()">إنشاء الرموز</button><p id="msg"></p></section><section id="grid" class="qrgrid"></section></div>
<script>
const L=["ا","ب","ت","ث","ج","ح","خ","د","ذ","ر","ز","س","ش","ص","ض","ط","ظ","ع","غ","ف","ق","ك","ل","م","ن","هـ","و","ي"];
function makeQR(){let base=document.getElementById("base").value.trim();if(!base.endsWith("/"))base+="/";let g=document.getElementById("grid");g.innerHTML="";
L.forEach((l,i)=>{let url=base+"?letter="+encodeURIComponent(l),c=document.createElement("div");c.className="qrcard";c.innerHTML=`<h2>حرف ${l}</h2><img src="https://api.qrserver.com/v1/create-qr-code/?size=500x500&data=${encodeURIComponent(url)}"><p>${url}</p>`;g.appendChild(c)});document.getElementById("msg").textContent="تم إنشاء 28 رمزًا.";}</script></body></html>
